  <body class="bg-surface text-on-surface antialiased">
    <div id="root"><div id="startup-screen" role="status" style="max-width:32rem;margin:15vh auto;padding:1.5rem;font-family:system-ui,sans-serif;color:#7a1228;text-align:center"><h1 id="startup-title" style="font-size:1.25rem">Opening your school portal…</h1><p id="startup-message">Please wait while the application loads.</p><button id="startup-retry" hidden style="padding:.75rem 1rem;border:1px solid #7a1228;border-radius:.5rem;background:white;color:#7a1228">Reload portal</button><noscript>Enable JavaScript in your browser to open the portal.</noscript></div></div>
    <script>
      (function () {
        var retry=document.getElementById('startup-retry');
        retry.onclick=function(){window.location.reload();};
        function showRecovery(){
          if(!document.getElementById('startup-screen'))return;
          document.getElementById('startup-title').textContent='The portal is taking longer to load';
          document.getElementById('startup-message').textContent='Check your connection, then reload to get the latest version.';
          retry.hidden=false;
        }
        setTimeout(showRecovery,15000);
        window.addEventListener('error',function(event){if(event.target&&event.target.tagName==='SCRIPT')showRecovery();},true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
